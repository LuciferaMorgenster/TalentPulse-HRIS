<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="talentPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#talentPulseGrad)"/>

  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>

  <!-- Foreground Group: Human + Pulse Wave -->
  <g filter="url(#glow)">
    <!-- Head -->
    <circle cx="256" cy="170" r="54" fill="#ffffff"/>

    <!-- Pulse Wave crossing through Torso -->
    <path d="M 120 350 L 200 350 L 225 310 L 256 395 L 285 285 L 315 350 L 392 350"
          fill="none"
          stroke="#ffffff"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Shoulder & Core Arc -->
    <path d="M 150 310 C 150 250, 195 240, 256 240 C 317 240, 362 250, 362 310"
          fill="none"
          stroke="#93c5fd"
          stroke-width="18"
          stroke-linecap="round"
          stroke-opacity="0.9"/>
  </g>

  <!-- Spark Accent -->
  <circle cx="392" cy="350" r="14" fill="#60a5fa"/>
</svg>
